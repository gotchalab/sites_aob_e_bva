<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Área de Sócios BVA — Em manutenção</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg, #f4f7fb 0%, #e9eef5 100%);
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    max-width: 560px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 40px 32px;
    box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: #fef3c7;
    color: #92400e;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 24px;
    line-height: 1.3;
    margin: 0 0 16px;
    color: #0f172a;
  }
  p { line-height: 1.6; margin: 0 0 12px; color: #475569; }
  a { color: #0369a1; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .divider { height: 1px; background: #e2e8f0; margin: 24px 0 20px; }
  .footer { font-size: 13px; color: #94a3b8; }
</style>
</head>
<body>
<main>
  <span class="badge">Em manutenção</span>
  <h1>Área de Sócios temporariamente indisponível</h1>
  <p>Estamos a fazer melhorias de segurança nesta área. O acesso está desactivado durante este período.</p>
  <p>Para questões urgentes, contacte-nos através do site principal.</p>
  <div class="divider"></div>
  <p class="footer">
    <a href="https://bva-p.aobarcelos.pt/">bva-p.aobarcelos.pt</a>
    &nbsp;·&nbsp;
    <a href="https://bva-p.aobarcelos.pt/contacto">Contacto</a>
  </p>
</main>
</body>
</html>
