# api.aobarcelos.pt — endpoint publico da API (opcional, tambem servido via /api/ nos dominios dos sites)

server {
    listen 80;
    listen [::]:80;
    server_name api.aobarcelos.pt;

    include /etc/nginx/snippets/aob-common.conf;

    location /uploads/ {
        alias /var/www/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        limit_req zone=aob_public burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 25M;
    gzip on;
}
