# bva-p-socios.aobarcelos.pt — PARADO (em manutencao).
#
# Contexto (2026-08-28):
# O backend original (bvaproject / SparkleIT.BackupManager.UI.dll) e ASP.NET
# Core 3.1 EOL (fim-de-vida em 2022-12-13). E o vector mais provavel do
# compromisso do VPS detectado nesse dia (malware `apache2-inits` como www-data,
# mesmo user do bvaproject; binario em /var/www/bva_site/tmp/).
#
# Enquanto nao migrar para stack actual (ex: Blazor/AOB.Api), o servico esta
# parado (systemctl disable bvaproject) e o nginx serve uma pagina 503 estatica.
#
# Se quiseres um dia reactivar SEM migrar (alto risco):
#   1. sudo systemctl start bvaproject
#   2. Restaurar o location / com proxy_pass http://127.0.0.1:5002 (ver git log)
#   3. Reload nginx
# Recomendado: nao. Migrar para .NET actual ou embutir na AOB.Api.

server {
    server_name bva-p-socios.aobarcelos.pt;

    include /etc/nginx/snippets/aob-common.conf;

    # Assets da propria pagina de manutencao (se um dia forem precisos)
    location = /favicon.ico { access_log off; log_not_found off; return 204; }

    location / {
        return 503;
    }

    error_page 503 /_maintenance.html;
    location = /_maintenance.html {
        root /var/www/aob-maintenance/bva-p-socios;
        internal;
        add_header Retry-After "2592000" always;      # 30 dias
        add_header Cache-Control "no-store" always;
    }

    client_max_body_size 1M;
    gzip on;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bva-p-socios.aobarcelos.pt-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bva-p-socios.aobarcelos.pt-0001/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


server {
    if ($host = bva-p-socios.aobarcelos.pt) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name bva-p-socios.aobarcelos.pt;
    return 404; # managed by Certbot
}
