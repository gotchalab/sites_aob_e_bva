# bva-p-socios.aobarcelos.pt — proxy para bvaproject (.NET SparkleIT porta 5002)
# Blocos SSL gerados originalmente pelo Certbot; mantidos aqui para o deploy
# de infra nao os apagar. Se o cert nao existir, correr no VPS:
#   sudo certbot --nginx -d bva-p-socios.aobarcelos.pt --redirect --non-interactive

server {
    server_name bva-p-socios.aobarcelos.pt;

    include /etc/nginx/snippets/aob-common.conf;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    client_max_body_size 50M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bva-p-socios.aobarcelos.pt-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bva-p-socios.aobarcelos.pt-0001/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


server {
    if ($host = bva-p-socios.aobarcelos.pt) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name bva-p-socios.aobarcelos.pt;
    return 404; # managed by Certbot
}
