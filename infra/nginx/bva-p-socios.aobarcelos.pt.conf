# bva-p-socios.aobarcelos.pt — proxy para bvaproject (.NET porta 5002)
# TLS gerido por certbot (adiciona listen 443 + ssl_certificate)

server {
    listen 80;
    listen [::]:80;
    server_name bva-p-socios.aobarcelos.pt;

    include /etc/nginx/snippets/aob-common.conf;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    client_max_body_size 50M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
