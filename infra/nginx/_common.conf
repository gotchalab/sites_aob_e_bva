# Snippets partilhados — included por server {} blocks
# NOTA: limit_req_zone esta em conf.d/aob-zones.conf (contexto http)

# Security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Bloqueia extensoes perigosas em /uploads
location ~* /uploads/.*\.(php|phtml|phar|pht|py|pl|cgi|sh|htaccess|htpasswd|ini)$ {
    return 403;
}
