# Snippets partilhados — included por outros vhosts

# Security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Sem PHP, sem interpretadores — bloqueia extensoes perigosas em /uploads
location ~* /uploads/.*\.(php|phtml|phar|pht|py|pl|cgi|sh|htaccess|htpasswd|ini)$ {
    return 403;
}

# Rate limit basico
limit_req_zone $binary_remote_addr zone=aob_public:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=aob_forms:10m rate=10r/m;
