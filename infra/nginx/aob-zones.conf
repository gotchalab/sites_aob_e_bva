# Contexto http — definicao das zonas de rate limiting AOB.
# Copiado para /etc/nginx/conf.d/aob-zones.conf pelo deploy.

# aob_public: paginas HTML + API leves. Uma page load de Next.js facilmente
# faz dezenas de subpedidos (chunks, prefetches RSC, /_next/image), por isso
# esta zona tem de ser generosa. Assets estaticos /_next/static/ ficam fora
# (excluidos pelas locations especificas nos vhosts).
limit_req_zone $binary_remote_addr zone=aob_public:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=aob_forms:10m  rate=10r/m;
