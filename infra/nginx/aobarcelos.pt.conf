# aobarcelos.pt — frontend Next.js + reverse proxy para API
# TLS gerido por certbot (adiciona listen 443 + ssl_certificate)

map $request_uri $legacy_redirect_aob {
    default "";
    include /etc/nginx/redirects.aob.map;
}

server {
    server_name aobarcelos.pt www.aobarcelos.pt;

    include /etc/nginx/snippets/aob-common.conf;

    if ($host = 'www.aobarcelos.pt') {
        return 301 https://aobarcelos.pt$request_uri;
    }

    # Redirects legacy Joomla → novos slugs
    if ($legacy_redirect_aob) {
        return 301 $legacy_redirect_aob;
    }

    # Uploads servidos direto (evita hop Next.js)
    location /uploads/ {
        alias /var/www/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # API (proxied ao asp.net localhost:5000, mesma origem)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limit dos forms
    location /api/sites/aob/forms/ {
        limit_req zone=aob_forms burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend Next.js
    location / {
        limit_req zone=aob_public burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    client_max_body_size 25M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aobarcelos.pt/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aobarcelos.pt/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.aobarcelos.pt) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = aobarcelos.pt) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name aobarcelos.pt www.aobarcelos.pt;
    return 404; # managed by Certbot




}